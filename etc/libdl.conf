# RTEMS run-time loader: archives searched for symbols that a loaded object
# leaves unresolved (cpukit/libdl/rtl-archive.c). Read from /etc/libdl.conf
# when the loader starts, re-read when the file changes. One absolute glob
# per line; the directory is scanned for matching names.
#
# EPICS support modules travel in epics.tar.gz as three files each: the
# module's own library lib/<arch>/libNAME.a (as built), its dbd
# dbd/NAME.dbd (as is) and the registration object
# bin/<arch>/NAME_registerRecordDeviceDriver.o generated from the dbd.
# epicsLoadModule "NAME" loads the registration object; its references to
# the module's device supports, drivers and registrars pull the needed
# members out of the library listed here (same semantics as static linking).
/lib/RTEMS-raspberrypi2/lib*.a
