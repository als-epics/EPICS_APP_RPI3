# EPICS IOC on the Raspberry Pi 3B+, served by the "SB 12" shared profile
# (192.168.2.10/24). NetworkManager starts dnsmasq with this directory as
# --conf-dir; it restarts when the profile is (re)activated.
#
# NTP server for the IOC (DHCP option 42); the IOC also carries it as a
# fallback in cmdline.txt: --net=dhcp,ntp=172.233.177.198
dhcp-option=option:ntp-server,172.233.177.198

# Log every DHCP exchange (journalctl -u NetworkManager | grep dnsmasq-dhcp)
log-dhcp

# Fixed address for the IOC, keyed on the board MAC. The Raspberry Pi
# firmware gives the LAN7515 the address b8:27:eb + the low three bytes of
# the board serial (the ROM's network boot uses it too), and since
# 2026-10-16 the IOC sets the same address on ue0 before dhcpcd runs
# (rpi3App/src/rtems_netsetup.c). The wildcard matches any Pi; replace
# the "*" octets with the ones from the IOC's "Board serial ..., MAC" boot
# line as soon as a second Pi is on this cable.
dhcp-host=b8:27:eb:45:d7:b0,192.168.2.21,rtems-pi3,infinite
# (any Pi: dhcp-host=b8:27:eb:*:*:*,192.168.2.21,rtems-pi3,infinite)

# Network boot of the Pi 3B+ (no SD card, or a card holding only
# bootcode.bin). The boot ROM / bootcode.bin send a DHCP request with the
# PXE vendor class and accept only an offer whose option 43 contains the
# text "Raspberry Pi Boot"; pxe-service produces exactly that. They then
# fetch bootcode.bin, start.elf, fixup.dat, config.txt, the dtb, cmdline.txt,
# kernel7.img and epics.tar.gz by TFTP from this server (next-server =
# dnsmasq itself), trying <serial>/<file> before <file>. The directory is
# filled by scripts/update_tftp.sh in the EPICS_APP_PI tree.
enable-tftp
tftp-root=/srv/tftp/rpi
pxe-service=0,"Raspberry Pi Boot"
